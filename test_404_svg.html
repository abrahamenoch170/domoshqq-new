<!DOCTYPE html>
<html>
<body style="background:#FFF;">
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Beam -->
  <path d="M 180 230 L 320 230 L 380 480 Q 250 510 120 480 Z" fill="#FCE5E1" opacity="0.7" />
  
  <!-- Crosses -->
  <g stroke="#1A1A1A" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="180" x2="90" y2="180" /><line x1="80" y1="170" x2="80" y2="190" />
    <line x1="420" y1="190" x2="440" y2="190" /><line x1="430" y1="180" x2="430" y2="200" />
    <line x1="385" y1="270" x2="405" y2="270" /><line x1="395" y1="260" x2="395" y2="280" />
  </g>

  <!-- Document -->
  <g transform="translate(250, 360) rotate(-20)">
    <path d="M -50 -70 L 20 -70 L 50 -40 L 50 70 L -50 70 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
    <path d="M 20 -70 L 20 -40 L 50 -40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Face -->
    <!-- Eyebrows (worried/sad) -->
    <path d="M -25 -10 Q -15 -15 -8 -5" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 8 -5 Q 15 -15 25 -10" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="-15" cy="5" r="4" fill="#1A1A1A" />
    <circle cx="15" cy="5" r="4" fill="#1A1A1A" />
    <!-- Mouth -->
    <path d="M -12 25 Q 0 15 12 25" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- UFO Dome -->
  <path d="M 155 210 C 155 100, 345 100, 345 210 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
  <text x="250" y="195" font-family="sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#1A1A1A">404</text>

  <!-- UFO Saucer -->
  <ellipse cx="250" cy="210" rx="160" ry="45" fill="#F26522" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Lights -->
  <g fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3">
    <circle cx="120" cy="210" r="8" />
    <circle cx="170" cy="235" r="10" />
    <circle cx="250" cy="245" r="12" />
    <circle cx="330" cy="235" r="10" />
    <circle cx="380" cy="210" r="8" />
  </g>
</svg>
</body>
</html>
